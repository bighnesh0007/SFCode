# The database for this machine's SFCode (dev and the sf.bighnesh.space service).
# Bound to loopback so it is never reachable from the network; the credentials
# only matter to processes already on this machine.
services:
  postgres:
    image: postgres:16
    # Docker starts on boot; this brings the database back with it.
    restart: unless-stopped
    environment:
      POSTGRES_USER: sfcode
      POSTGRES_PASSWORD: sfcode
      POSTGRES_DB: sfcode
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sfcode-pg:/var/lib/postgresql/data
volumes:
  sfcode-pg:
