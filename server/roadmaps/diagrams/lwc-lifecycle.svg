<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 402" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>LWC lifecycle: constructor, connectedCallback when inserted, render, renderedCallback after every render, disconnectedCallback when removed; errorCallback catches errors in children.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="640" height="402" rx="16" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">A component&#x27;s lifecycle</text><rect x="24" y="56" width="592" height="46" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><circle cx="42" cy="79.0" r="11" fill="#334155"/><text x="42" y="83.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="62" y="76.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">constructor()</text><text x="62" y="93.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Set up fields; don&#x27;t touch the DOM or attributes yet</text><line x1="320.0" y1="102" x2="320.0" y2="116" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="24" y="116" width="592" height="46" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><circle cx="42" cy="139.0" r="11" fill="#0369a1"/><text x="42" y="143.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="62" y="136.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">connectedCallback()</text><text x="62" y="153.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Inserted into the page: load data, subscribe</text><line x1="320.0" y1="162" x2="320.0" y2="176" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="24" y="176" width="592" height="46" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><circle cx="42" cy="199.0" r="11" fill="#15803d"/><text x="42" y="203.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="62" y="196.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">render</text><text x="62" y="213.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">The template draws with the current state</text><line x1="320.0" y1="222" x2="320.0" y2="236" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="24" y="236" width="592" height="46" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><circle cx="42" cy="259.0" r="11" fill="#b45309"/><text x="42" y="263.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="62" y="256.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">renderedCallback()</text><text x="62" y="273.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">After every render: work with the DOM, guard against loops</text><line x1="320.0" y1="282" x2="320.0" y2="296" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="24" y="296" width="592" height="46" rx="10" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><circle cx="42" cy="319.0" r="11" fill="#be123c"/><text x="42" y="323.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="62" y="316.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">disconnectedCallback()</text><text x="62" y="333.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Removed: unsubscribe, clear timers</text><text x="24" y="368" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">errorCallback(error, stack) on a parent catches errors thrown in its children&#x27;s lifecycle.</text></svg>
