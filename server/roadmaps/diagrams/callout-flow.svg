<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Callouts: Apex sends an HttpRequest to a Named Credential, which holds the URL and authentication and calls the external API; tests use HttpCalloutMock.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="680" height="260" rx="16" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Calling an external API safely</text><rect x="24" y="90" width="170" height="54" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="38" y="114.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Apex</text><text x="38" y="131.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">HttpRequest</text><rect x="270" y="90" width="200" height="54" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><text x="284" y="114.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Named Credential</text><text x="284" y="131.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">URL and auth, no secrets in code</text><rect x="526" y="90" width="130" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="540" y="114.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">External API</text><text x="540" y="131.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">returns JSON</text><line x1="196" y1="117" x2="268" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><text x="232.0" y="109" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">callout:Name</text><line x1="472" y1="117" x2="524" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><text x="24" y="190" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">In tests: Test.setMock(HttpCalloutMock.class, ...) answers instead of the API.</text><text x="24" y="210" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">No callouts after uncommitted DML in the same transaction; use Queueable from triggers.</text></svg>
