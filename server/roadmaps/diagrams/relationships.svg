<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Lookup (Contact to Account), master-detail (Expense to Project) and a junction object (Enrollment linking Student and Course).</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="680" height="330" rx="16" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Relationships between objects</text><rect x="24" y="64" width="190" height="54" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="38" y="88.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Account</text><text x="38" y="105.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">parent</text><rect x="24" y="220" width="190" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="38" y="244.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Contact</text><text x="38" y="261.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Lookup to Account</text><line x1="119" y1="220" x2="119" y2="120" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><text x="125.0" y="174.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">lookup</text><text x="24" y="300" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Loose: child survives the parent.</text><rect x="250" y="64" width="190" height="54" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><text x="264" y="88.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Project__c</text><text x="264" y="105.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">master</text><rect x="250" y="220" width="190" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="264" y="244.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Expense__c</text><text x="264" y="261.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Master-detail</text><line x1="345" y1="220" x2="345" y2="120" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><text x="351.0" y="174.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">master-detail</text><text x="250" y="300" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Tight: deleted with the master; roll-ups.</text><rect x="476" y="64" width="90" height="54" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="490" y="95.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Student</text><rect x="576" y="64" width="90" height="54" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="590" y="95.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Course</text><rect x="476" y="220" width="190" height="54" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="490" y="244.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Enrollment__c</text><text x="490" y="261.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">junction: 2 master-details</text><line x1="521" y1="220" x2="521" y2="120" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><line x1="621" y1="220" x2="621" y2="120" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><text x="476" y="300" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Many-to-many via a junction.</text></svg>
