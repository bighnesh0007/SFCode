<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>LWC communication: a parent passes data down to a child with @api properties, the child sends events up, and unrelated components use Lightning Message Service.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="680" height="350" rx="16" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">How Lightning web components talk</text><rect x="24" y="60" width="260" height="54" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="38" y="84.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">c-parent</text><text x="38" y="101.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">owns the data</text><rect x="24" y="230" width="260" height="54" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="38" y="254.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">c-child</text><text x="38" y="271.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">@api properties</text><line x1="90" y1="116" x2="90" y2="228" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><text x="96.0" y="176.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">@api props down</text><line x1="218" y1="228" x2="218" y2="116" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="224.0" y="176.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">CustomEvent up</text><rect x="400" y="60" width="256" height="54" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><text x="414" y="84.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Message channel</text><text x="414" y="101.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Lightning Message Service</text><rect x="400" y="230" width="256" height="54" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="414" y="254.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">c-unrelated</text><text x="414" y="271.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">anywhere on the page</text><line x1="286" y1="245" x2="398" y2="100" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="348.0" y="176.5" font-size="11" font-weight="400" fill="#475569" text-anchor="start">publish</text><line x1="528" y1="116" x2="528" y2="228" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="534.0" y="176.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">subscribe</text><text x="24" y="316" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Data flows down as properties and up as events; components with no parent-child link use a message channel.</text></svg>
