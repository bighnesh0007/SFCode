<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Choosing automation: before-save flows for same-record updates, after-save flows for other records, screen flows to guide users, scheduled flows for timing, approval processes for sign-off, Apex when logic or volume is beyond Flow.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="680" height="400" rx="16" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Which automation tool?</text><text x="24" y="83" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">Update the same record on save</text><line x1="330" y1="79" x2="362" y2="79" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="364" y="56" width="292" height="44" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="378" y="82.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Before-save record-triggered flow</text><text x="24" y="133" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">Create or update other records, send alerts</text><line x1="330" y1="129" x2="362" y2="129" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="364" y="106" width="292" height="44" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="378" y="132.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">After-save record-triggered flow</text><text x="24" y="183" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">Guide a user through steps</text><line x1="330" y1="179" x2="362" y2="179" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="364" y="156" width="292" height="44" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="378" y="182.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Screen flow</text><text x="24" y="233" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">Run on a schedule or a date</text><line x1="330" y1="229" x2="362" y2="229" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="364" y="206" width="292" height="44" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="378" y="232.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Scheduled flow or scheduled path</text><text x="24" y="283" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">Someone must sign off, record locked</text><line x1="330" y1="279" x2="362" y2="279" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="364" y="256" width="292" height="44" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><text x="378" y="282.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Approval process</text><text x="24" y="333" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">Logic too complex or too much volume</text><line x1="330" y1="329" x2="362" y2="329" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="364" y="306" width="292" height="44" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="378" y="332.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Apex (ask a developer)</text><text x="24" y="370" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Workflow Rules and Process Builder are retired for new automation: build in Flow.</text></svg>
