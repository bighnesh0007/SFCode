<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Deployment pipeline: build in a scratch org or sandbox, commit to Git, run tests in CI, check in a UAT sandbox, then deploy to production.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="680" height="250" rx="16" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">From your org to production</text><rect x="24" y="90" width="118" height="54" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="38" y="114.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Scratch org</text><text x="38" y="131.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">or sandbox: build</text><line x1="142" y1="117" x2="156" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="156" y="90" width="118" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="170" y="114.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Git</text><text x="170" y="131.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">source of truth</text><line x1="274" y1="117" x2="288" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="288" y="90" width="118" height="54" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="302" y="114.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">CI</text><text x="302" y="131.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">tests, scans</text><line x1="406" y1="117" x2="420" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="420" y="90" width="118" height="54" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="434" y="114.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">UAT sandbox</text><text x="434" y="131.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">check</text><line x1="538" y1="117" x2="552" y2="117" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="552" y="90" width="118" height="54" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><text x="566" y="114.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Production</text><text x="566" y="131.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">deploy</text><text x="24" y="180" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Production deploys run your tests: 75% org-wide coverage, every trigger covered, all tests pass.</text><text x="24" y="200" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Tools: Salesforce CLI and source format; packages or change sets as alternatives.</text></svg>
