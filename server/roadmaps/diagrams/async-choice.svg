<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Choosing asynchronous Apex: future for simple deferred work, Queueable for objects and chaining, Batch for millions of records, Schedulable for timed runs, Platform Events to notify other systems, and Queueable or future with callout for callouts from triggers.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="680" height="360" rx="16" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Which asynchronous Apex?</text><rect x="24" y="60" width="300" height="50" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="38" y="82.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Run later, simple, primitive args</text><text x="38" y="99.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">@future</text><rect x="24" y="124" width="300" height="50" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="38" y="146.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Run later, objects as args, chain jobs</text><text x="38" y="163.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Queueable</text><rect x="24" y="188" width="300" height="50" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="38" y="210.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Millions of records in chunks</text><text x="38" y="227.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Batch Apex</text><rect x="24" y="252" width="300" height="50" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="38" y="274.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">At a time of day, repeatedly</text><text x="38" y="291.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Schedulable</text><rect x="356" y="60" width="300" height="50" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><text x="370" y="82.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Tell other systems something happened</text><text x="370" y="99.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Platform Events</text><rect x="356" y="124" width="300" height="50" rx="10" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="370" y="146.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Callout from a trigger</text><text x="370" y="163.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Queueable or @future(callout=true)</text><text x="356" y="210" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">All async Apex gets higher limits:</text><text x="356" y="228" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">200 SOQL queries, 12 MB heap, 60 s CPU.</text><text x="356" y="258" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Nothing async runs until the</text><text x="356" y="276" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">transaction that queued it commits.</text></svg>
