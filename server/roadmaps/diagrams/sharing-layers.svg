<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Record access in layers: organization-wide defaults, then role hierarchy, sharing rules, manual sharing and teams, and Apex managed sharing, each only adding access.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="640" height="380" rx="16" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Who can see a record: layers of access</text><rect x="24" y="60" width="592" height="50" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><circle cx="42" cy="85.0" r="11" fill="#334155"/><text x="42" y="89.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="62" y="82.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Organization-wide defaults</text><text x="62" y="99.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">The baseline: Private, Public Read Only or Public Read/Write</text><rect x="38" y="120" width="564" height="50" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><circle cx="56" cy="145.0" r="11" fill="#0369a1"/><text x="56" y="149.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="76" y="142.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Role hierarchy</text><text x="76" y="159.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Managers see what their team owns</text><rect x="52" y="180" width="536" height="50" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><circle cx="70" cy="205.0" r="11" fill="#15803d"/><text x="70" y="209.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="90" y="202.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Sharing rules</text><text x="90" y="219.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Open up by owner or by criteria, to groups or roles</text><rect x="66" y="240" width="508" height="50" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><circle cx="84" cy="265.0" r="11" fill="#b45309"/><text x="84" y="269.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="104" y="262.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Manual sharing and teams</text><text x="104" y="279.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">One record at a time</text><rect x="80" y="300" width="480" height="50" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><circle cx="98" cy="325.0" r="11" fill="#6d28d9"/><text x="98" y="329.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="118" y="322.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Apex managed sharing</text><text x="118" y="339.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Code adds shares, e.g. for a custom process</text><text x="24" y="370" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Layers 2 to 5 only ever add access on top of the defaults; none of them can take access away.</text></svg>
