<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Salesforce&#x27;s order of execution, simplified: before-save flows, before triggers, validation and duplicate rules, save, after triggers, assignment rules, after-save flows, roll-ups, commit, then post-commit work.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="640" height="780" rx="16" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">What happens when a record is saved (simplified)</text><rect x="24" y="56" width="592" height="46" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><circle cx="42" cy="79.0" r="11" fill="#15803d"/><text x="42" y="83.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="62" y="76.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Before-save record-triggered flows</text><text x="62" y="93.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Fast Field Updates: change the record, no DML</text><line x1="320.0" y1="102" x2="320.0" y2="116" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="24" y="116" width="592" height="46" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><circle cx="42" cy="139.0" r="11" fill="#0369a1"/><text x="42" y="143.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="62" y="136.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Before triggers</text><text x="62" y="153.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Change Trigger.new directly; no DML on these records</text><line x1="320.0" y1="162" x2="320.0" y2="176" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="24" y="176" width="592" height="46" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><circle cx="42" cy="199.0" r="11" fill="#b45309"/><text x="42" y="203.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="62" y="196.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Validation rules</text><text x="62" y="213.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">System checks, then your custom validation rules</text><line x1="320.0" y1="222" x2="320.0" y2="236" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="24" y="236" width="592" height="46" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><circle cx="42" cy="259.0" r="11" fill="#b45309"/><text x="42" y="263.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="62" y="256.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Duplicate rules</text><text x="62" y="273.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Block or alert on matching records</text><line x1="320.0" y1="282" x2="320.0" y2="296" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="24" y="296" width="592" height="46" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><circle cx="42" cy="319.0" r="11" fill="#334155"/><text x="42" y="323.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="62" y="316.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Record saved to the database</text><text x="62" y="333.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Not committed yet: Ids now exist</text><line x1="320.0" y1="342" x2="320.0" y2="356" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="24" y="356" width="592" height="46" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><circle cx="42" cy="379.0" r="11" fill="#0369a1"/><text x="42" y="383.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="62" y="376.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">After triggers</text><text x="62" y="393.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Records are read-only; update other records here</text><line x1="320.0" y1="402" x2="320.0" y2="416" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="24" y="416" width="592" height="46" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><circle cx="42" cy="439.0" r="11" fill="#334155"/><text x="42" y="443.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="62" y="436.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Assignment and auto-response rules</text><text x="62" y="453.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Leads and cases</text><line x1="320.0" y1="462" x2="320.0" y2="476" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="24" y="476" width="592" height="46" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><circle cx="42" cy="499.0" r="11" fill="#15803d"/><text x="42" y="503.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="62" y="496.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">After-save record-triggered flows</text><text x="62" y="513.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Actions and related records</text><line x1="320.0" y1="522" x2="320.0" y2="536" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="24" y="536" width="592" height="46" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><circle cx="42" cy="559.0" r="11" fill="#334155"/><text x="42" y="563.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">9</text><text x="62" y="556.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Roll-up summaries and parent updates</text><text x="62" y="573.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Parent records recalculate and save too</text><line x1="320.0" y1="582" x2="320.0" y2="596" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="24" y="596" width="592" height="46" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><circle cx="42" cy="619.0" r="11" fill="#6d28d9"/><text x="42" y="623.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">10</text><text x="62" y="616.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Commit</text><text x="62" y="633.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">All or nothing: any error rolls everything back</text><line x1="320.0" y1="642" x2="320.0" y2="656" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="24" y="656" width="592" height="46" rx="10" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><circle cx="42" cy="679.0" r="11" fill="#be123c"/><text x="42" y="683.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">11</text><text x="62" y="676.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">After commit</text><text x="62" y="693.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Emails send, async Apex and platform events start</text><text x="24" y="728" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Workflow field updates (legacy) can re-run update triggers once.</text><text x="24" y="746" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Full list: Apex Developer Guide, &quot;Triggers and Order of Execution&quot;.</text></svg>
