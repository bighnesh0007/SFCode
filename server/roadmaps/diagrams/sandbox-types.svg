<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Sandbox types: Developer (metadata, 200 MB, 1-day refresh), Developer Pro (metadata, 1 GB, 1-day refresh), Partial Copy (metadata and sample data, 5 GB, 5-day refresh), Full (all data, production size, 29-day refresh).</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="680" height="300" rx="16" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Sandbox types</text><rect x="24" y="60" width="150" height="170" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="38" y="88" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Developer</text><text x="38" y="122" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Metadata only</text><text x="38" y="150" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">200 MB data</text><text x="38" y="178" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Refresh: 1 day</text><rect x="184" y="60" width="150" height="170" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="198" y="88" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Developer Pro</text><text x="198" y="122" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Metadata only</text><text x="198" y="150" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">1 GB data</text><text x="198" y="178" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Refresh: 1 day</text><rect x="344" y="60" width="150" height="170" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="358" y="88" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Partial Copy</text><text x="358" y="122" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Metadata + sample</text><text x="358" y="150" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">5 GB data</text><text x="358" y="178" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Refresh: 5 days</text><rect x="504" y="60" width="150" height="170" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><text x="518" y="88" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Full</text><text x="518" y="122" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Metadata + all data</text><text x="518" y="150" font-size="12" font-weight="600" fill="#0f172a" text-anchor="start">Same as production</text><text x="518" y="178" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Refresh: 29 days</text><text x="24" y="262" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Build in Developer sandboxes; test with realistic data in Partial Copy; rehearse releases in Full.</text></svg>
