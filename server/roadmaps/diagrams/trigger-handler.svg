<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Trigger handler pattern: a one-line trigger calls a handler, which routes to service and selector classes and uses a static recursion guard.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="660" height="300" rx="16" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">One trigger per object, logic in classes</text><rect x="24" y="60" width="200" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="38" y="84.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">AccountTrigger</text><text x="38" y="101.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">no logic, one line</text><rect x="246" y="60" width="200" height="54" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="260" y="84.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">AccountTriggerHandler</text><text x="260" y="101.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">routes by event</text><rect x="468" y="40" width="170" height="44" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="482" y="66.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">AccountService</text><rect x="468" y="96" width="170" height="44" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="482" y="122.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">AccountSelector</text><line x1="226" y1="87" x2="244" y2="87" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><line x1="448" y1="80" x2="466" y2="62" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><line x1="448" y1="94" x2="466" y2="118" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="226" y="170" width="240" height="54" rx="10" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="240" y="194.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Recursion guard</text><text x="240" y="211.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">static Set&lt;Id&gt; already processed</text><line x1="346" y1="116" x2="346" y2="168" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="24" y="270" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Thin triggers are easy to read, order and test; the handler decides what runs for each event.</text></svg>
