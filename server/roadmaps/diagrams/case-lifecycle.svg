<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Case lifecycle: Email-to-Case or Web-to-Case creates a case, an assignment rule routes it to a queue or agent, an escalation rule acts if it stays open too long, and it ends closed.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="680" height="300" rx="16" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">How a support case moves</text><rect x="24" y="60" width="170" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="38" y="84.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Email-to-Case</text><text x="38" y="101.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">or Web-to-Case</text><line x1="196" y1="87" x2="236" y2="87" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="238" y="60" width="170" height="54" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="252" y="84.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Assignment rule</text><text x="252" y="101.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">to a queue or agent</text><line x1="410" y1="87" x2="450" y2="87" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="452" y="60" width="204" height="54" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="466" y="84.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Queue / Omni-Channel</text><text x="466" y="101.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">agents pick or receive work</text><rect x="238" y="170" width="170" height="54" rx="10" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="252" y="194.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Escalation rule</text><text x="252" y="211.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">still open after X hours</text><rect x="452" y="170" width="204" height="54" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><text x="466" y="194.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Closed</text><text x="466" y="211.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">with a solution or article</text><line x1="554" y1="116" x2="554" y2="168" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><text x="560.0" y="146.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">resolved</text><line x1="450" y1="110" x2="410" y2="168" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="436.0" y="143.0" font-size="11" font-weight="400" fill="#475569" text-anchor="start">too slow</text><text x="24" y="260" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Entitlements and milestones track promised response times; auto-response rules reply to the customer.</text></svg>
