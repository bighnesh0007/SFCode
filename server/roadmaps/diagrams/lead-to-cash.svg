<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Lead to cash: a Lead converts into an Account, a Contact and optionally an Opportunity, which gets a Quote with products and is eventually Closed.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="680" height="300" rx="16" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">From lead to closed deal</text><rect x="24" y="60" width="140" height="54" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="38" y="84.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Lead</text><text x="38" y="101.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">not yet qualified</text><line x1="166" y1="87" x2="214" y2="87" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><text x="190.0" y="79" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">convert</text><rect x="216" y="40" width="150" height="44" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="230" y="66.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Account</text><rect x="216" y="92" width="150" height="44" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="230" y="118.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Contact</text><rect x="216" y="144" width="150" height="44" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="230" y="163.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Opportunity</text><text x="230" y="180.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">optional</text><line x1="368" y1="166" x2="416" y2="166" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="418" y="144" width="120" height="44" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="432" y="163.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Quote</text><text x="432" y="180.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">products</text><line x1="540" y1="166" x2="564" y2="166" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#a)"/><rect x="566" y="144" width="92" height="44" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><text x="580" y="170.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Closed</text><text x="24" y="230" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Conversion creates (or merges into) an Account and a Contact, and optionally an Opportunity.</text><text x="24" y="250" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Opportunities move through stages (Path); products come from price books.</text></svg>
