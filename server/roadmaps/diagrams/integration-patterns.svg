<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Six integration patterns: request and reply, fire and forget, batch data sync, remote call-in, UI update from data change, and data virtualisation.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="680" height="330" rx="16" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Integration patterns</text><rect x="24" y="56" width="308" height="62" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="38" y="84.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Request and reply</text><text x="38" y="101.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Call and wait for the answer (callout)</text><rect x="348" y="56" width="308" height="62" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="362" y="84.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Fire and forget</text><text x="362" y="101.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Send and move on (platform events)</text><rect x="24" y="132" width="308" height="62" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="38" y="160.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Batch data sync</text><text x="38" y="177.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Move many records on a schedule (Bulk API)</text><rect x="348" y="132" width="308" height="62" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><text x="362" y="160.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Remote call-in</text><text x="362" y="177.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Another system calls Salesforce (APIs)</text><rect x="24" y="208" width="308" height="62" rx="10" fill="#ffe4e6" stroke="#be123c" stroke-width="1.5"/><text x="38" y="236.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">UI update from data change</text><text x="38" y="253.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Push changes to listeners (CDC, streaming)</text><rect x="348" y="208" width="308" height="62" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="362" y="236.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Data virtualisation</text><text x="362" y="253.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">External data shown, not copied (Connect)</text><text x="24" y="300" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Pick by: who starts it, does the caller wait, how much data, how fresh it must be.</text></svg>
