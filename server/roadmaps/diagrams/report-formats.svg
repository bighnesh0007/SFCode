<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>Report formats: Tabular is a plain list, Summary groups rows with subtotals, Matrix groups by rows and columns, Joined shows several report blocks side by side.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="680" height="280" rx="16" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">Report formats</text><rect x="24" y="60" width="150" height="120" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="38" y="88" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Tabular</text><text x="38" y="114" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">A simple list, like</text><text x="38" y="130" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">a spreadsheet</text><rect x="184" y="60" width="150" height="120" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="198" y="88" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Summary</text><text x="198" y="114" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Grouped by rows,</text><text x="198" y="130" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">with subtotals</text><rect x="344" y="60" width="150" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="358" y="88" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Matrix</text><text x="358" y="114" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Grouped by rows and</text><text x="358" y="130" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">columns</text><rect x="504" y="60" width="150" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="518" y="88" font-size="14" font-weight="700" fill="#0f172a" text-anchor="start">Joined</text><text x="518" y="114" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Several report</text><text x="518" y="130" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">blocks side by side</text><text x="24" y="214" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Report types decide which objects and related records a report can include.</text><text x="24" y="234" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Dashboards chart summary or matrix reports; dynamic dashboards run as the viewer.</text></svg>
