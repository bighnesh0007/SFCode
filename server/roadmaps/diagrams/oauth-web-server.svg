<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><title>OAuth web server flow: the app redirects the user to Salesforce to authorize, the user logs in and approves, Salesforce redirects back with a code, the app exchanges it with its secret and PKCE verifier for access and refresh tokens.</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><rect width="680" height="360" rx="16" fill="#ffffff"/><text x="24" y="34" font-size="17" font-weight="700" fill="#0f172a" text-anchor="start">OAuth web server flow (with PKCE)</text><rect x="24" y="60" width="170" height="50" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/><text x="38" y="82.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Your app</text><text x="38" y="99.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">server side</text><rect x="486" y="60" width="170" height="50" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/><text x="500" y="82.0" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">Salesforce</text><text x="500" y="99.0" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">login + token endpoint</text><rect x="255" y="60" width="170" height="50" rx="10" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="269" y="89.5" font-size="13.5" font-weight="600" fill="#0f172a" text-anchor="start">User&#x27;s browser</text><text x="24" y="132" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">1. App sends the user to /authorize (client id, scopes, PKCE challenge)</text><text x="24" y="172" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">2. User logs in and approves the scopes</text><text x="24" y="212" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">3. Salesforce redirects back to your callback with a one-time code</text><text x="24" y="252" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">4. App posts code + secret + PKCE verifier to /token</text><text x="24" y="292" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">5. Salesforce returns an access token and a refresh token</text><text x="24" y="326" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">Keep tokens server-side and encrypted; refresh tokens are long-lived credentials.</text></svg>
