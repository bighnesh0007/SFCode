name: Feature request
description: Suggest an improvement or a new feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: checkboxes
    id: build
    attributes:
      label: Contributing
      options:
        - label: I'd like to build this myself (we'll agree the approach here first)
